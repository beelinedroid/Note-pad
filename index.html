<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plain Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two panes. Left: search, month calendar, note list. Right: a quiet editor with a thin toolbar. One pane at a time on phones. */
:root{
  --bg:#ffffff;
  --side:#f5f6f7;
  --fg:#16181a;
  --muted:#6a6f76;
  --line:#e2e4e7;
  --soft:#eceef0;
  --inv:#16181a;
  --on-inv:#ffffff;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131415;--side:#1a1b1d;--fg:#ececee;--muted:#8e9299;--line:#2b2d30;--soft:#232528;--inv:#ececee;--on-inv:#131415;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131415;--side:#1a1b1d;--fg:#ececee;--muted:#8e9299;--line:#2b2d30;--soft:#232528;--inv:#ececee;--on-inv:#131415;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:1px}

.app{height:100%;display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr)}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding-inline:var(--gl) var(--gr)}
.side-top{display:flex;align-items:center;justify-content:space-between;padding-block:16px 10px}
.side-top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.btn{font-size:13px;padding:6px 12px;border:1px solid var(--line);background:transparent;border-radius:4px;cursor:pointer;line-height:1.3}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.btn.solid:hover{opacity:.88}
.search input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:14px}
.search input::placeholder{color:var(--muted)}

.cal-head{display:flex;align-items:center;gap:2px;padding:16px 0 6px}
.cal-head .lbl{flex:1;font-weight:600;font-size:13px}
.icon-btn{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:4px;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--soft)}
.link-btn{border:0;background:transparent;padding:4px 6px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-radius:4px}
.link-btn:hover{color:var(--fg);background:var(--soft)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{font:500 10px var(--mono);color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.06em}
.day{position:relative;height:34px;border:1px solid transparent;background:transparent;font:13px var(--mono);border-radius:4px;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.day:hover{background:var(--soft)}
.day.today{border-color:var(--fg)}
.day.sel{background:var(--inv);color:var(--on-inv)}
.day.has::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}

.list-head{display:flex;justify-content:space-between;align-items:center;min-height:28px;margin-top:10px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{list-style:none;margin:0;padding:0 0 16px;overflow:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;width:100%;text-align:left;padding:9px 10px;margin:0 0 1px;border:0;border-radius:4px;background:transparent;cursor:pointer}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft)}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{grid-column:1;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{grid-row:1;grid-column:2;font:11px var(--mono);color:var(--muted);align-self:center}
.none{padding:14px 2px;color:var(--muted);font-size:13px}

/* editor */
.editor{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px var(--gr) 6px var(--gl)}
.back{display:none;align-items:center;gap:4px}
.tools-bar{position:relative;border-bottom:1px solid var(--line)}
.tools{display:flex;align-items:center;gap:2px;overflow-x:auto;padding:4px var(--gr) 8px var(--gl);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;height:30px;min-width:30px;padding:0 9px;border:1px solid transparent;background:transparent;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--soft)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.i{font-style:italic;font-family:Georgia,serif;font-size:15px}
.sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 6px}
.pop{position:absolute;top:calc(100% + 4px);left:var(--gl);z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;gap:12px;align-items:flex-end;box-shadow:0 8px 28px rgb(0 0 0 / .14)}
.pop label{display:flex;flex-direction:column;gap:4px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:transparent;font:14px var(--mono)}
.actions{display:flex;gap:6px}
.pop.exp{flex-direction:column;align-items:stretch;gap:8px;left:auto;right:var(--gr);width:min(320px,calc(100vw - 32px));box-sizing:border-box}
.pop.exp .grp{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:2px}
.pop.exp .grp span:last-child{text-transform:none;letter-spacing:0;text-align:right}
.pop.exp .row{display:flex;flex-wrap:wrap;gap:6px}
.pop.exp .btn:disabled{opacity:.4;cursor:default}
.pop.exp .btn:disabled:hover{background:transparent}
.pop.exp .msg{min-height:18px;font:12px var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

.ed-scroll{flex:1;min-height:0;overflow:auto;padding-inline:var(--gl) var(--gr)}
.ed-inner{max-width:760px;margin:0 auto;padding:26px 0 72px;min-width:0}
.title{display:block;width:100%;box-sizing:border-box;border:0;outline:0;background:transparent;font:600 28px/1.25 var(--ui);padding:0;margin:0 0 10px;letter-spacing:-.01em}
.title::placeholder{color:var(--muted);opacity:.7}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px;font:12px var(--mono);color:var(--muted)}
.meta input{font:12px var(--mono);padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:transparent}
.body{outline:0;font-size:16px;line-height:1.65;min-height:40vh;overflow-wrap:anywhere}
.body:empty::before{content:attr(data-ph);color:var(--muted)}
.body p,.body div{margin:0 0 .6em}
.body h2{font-size:20px;margin:1em 0 .4em;line-height:1.3}
.body ul,.body ol{margin:0 0 .8em;padding-left:1.4em}
.body table{border-collapse:collapse;width:100%;margin:14px 0}
.body th,.body td{border:1px solid var(--line);padding:8px 10px;min-width:92px;text-align:left;vertical-align:top;font-size:15px;line-height:1.45}
.body td>div,.body th>div,.body td>p,.body th>p{margin:0}
.body th{background:var(--side);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.ed-foot{display:flex;justify-content:space-between;gap:12px;padding:8px var(--gr) 8px var(--gl);border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted)}
.empty{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:24px var(--gr) 24px var(--gl);text-align:center}
.editor.is-empty>:not(.empty){display:none}
.editor.is-empty>.empty{display:flex}

@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app[data-view="list"] .editor{display:none}
  .app[data-view="editor"] .side{display:none}
  .back{display:inline-flex}
  .side{overflow-y:auto}
  .list{overflow:visible;flex:none}
  .title{font-size:24px}
}
</style>

<div class="app" id="app" data-view="list">
  <aside class="side">
    <header class="side-top">
      <h1>Notes</h1>
      <button class="btn solid" id="newBtn" type="button">New note</button>
    </header>
    <div class="search"><input id="q" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off"></div>

    <div class="cal-head">
      <span class="lbl" id="calLabel"></span>
      <button class="icon-btn" id="calPrev" type="button" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg></button>
      <button class="icon-btn" id="calNext" type="button" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg></button>
      <button class="link-btn" id="calToday" type="button">Today</button>
      <button class="link-btn" id="calToggle" type="button" aria-expanded="true">Hide</button>
    </div>
    <div class="cal-grid" id="calGrid" role="group" aria-label="Calendar"></div>

    <div class="list-head"><span id="listTitle"></span><button class="link-btn" id="clearFilter" type="button" hidden>Show all</button></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="editor is-empty" id="editor">
    <div class="ed-top">
      <button class="btn back" id="backBtn" type="button"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>Notes</button>
      <span></span>
      <div class="actions">
        <button class="btn" id="expBtn" type="button" aria-haspopup="true" aria-expanded="false">Export</button>
        <button class="btn" id="delBtn" type="button">Delete</button>
      </div>
    </div>
    <div class="tools-bar" id="toolsBar">
      <div class="tools" id="tools">
        <button class="tb" type="button" data-cmd="bold" title="Bold" aria-label="Bold"><b>B</b></button>
        <button class="tb i" type="button" data-cmd="italic" title="Italic" aria-label="Italic">I</button>
        <button class="tb" type="button" data-cmd="heading" title="Heading" aria-label="Heading">Heading</button>
        <button class="tb" type="button" data-cmd="list" title="Bulleted list" aria-label="Bulleted list">List</button>
        <span class="sep"></span>
        <button class="tb" type="button" id="tblBtn" aria-haspopup="true" aria-expanded="false">Table</button>
        <button class="tb" type="button" data-act="addRow" disabled>+ Row</button>
        <button class="tb" type="button" data-act="addCol" disabled>+ Col</button>
        <button class="tb" type="button" data-act="delRow" disabled>&minus; Row</button>
        <button class="tb" type="button" data-act="delCol" disabled>&minus; Col</button>
        <button class="tb" type="button" data-act="delTable" disabled>Remove table</button>
      </div>
      <div class="pop" id="tblPop" hidden>
        <label>Rows<input id="tblRows" type="number" min="2" max="20" value="3" inputmode="numeric"></label>
        <label>Columns<input id="tblCols" type="number" min="1" max="8" value="3" inputmode="numeric"></label>
        <button class="btn solid" id="tblGo" type="button">Insert</button>
      </div>
      <div class="pop exp" id="expPop" hidden>
        <div class="grp"><span>Note</span></div>
        <div class="row">
          <button class="btn" type="button" data-exp="note:pdf">PDF</button>
          <button class="btn" type="button" data-exp="note:md">Markdown</button>
          <button class="btn" type="button" data-exp="note:txt">Text</button>
          <button class="btn" type="button" data-exp="note:html">HTML</button>
        </div>
        <div class="grp"><span>Table</span><span id="expHint"></span></div>
        <div class="row">
          <button class="btn" type="button" data-exp="table:pdf" disabled>PDF</button>
          <button class="btn" type="button" data-exp="table:xlsx" disabled>Excel</button>
          <button class="btn" type="button" data-exp="table:csv" disabled>CSV</button>
          <button class="btn" type="button" data-exp="table:png" disabled>Image</button>
        </div>
        <div class="msg" id="expMsg" role="status"></div>
      </div>
    </div>
    <div class="ed-scroll" id="edScroll">
      <div class="ed-inner">
        <input class="title" id="title" type="text" placeholder="Untitled" aria-label="Title" autocomplete="off">
        <div class="meta"><label for="date">Date</label><input type="date" id="date"><span id="meta"></span></div>
        <div class="body" id="body" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Note" data-ph="Start writing"></div>
      </div>
    </div>
    <div class="ed-foot"><span id="count"></span><span id="status"></span></div>
    <div class="empty"><div>No note open.</div><button class="btn solid" id="emptyNew" type="button">New note</button></div>
  </main>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var LS='plainnotes.v1', LSU='plainnotes.ui';
var app=$('#app'),editor=$('#editor'),q=$('#q'),listEl=$('#list'),listTitle=$('#listTitle'),clearFilter=$('#clearFilter'),
    calGrid=$('#calGrid'),calLabel=$('#calLabel'),titleEl=$('#title'),dateEl=$('#date'),bodyEl=$('#body'),
    metaEl=$('#meta'),countEl=$('#count'),statusEl=$('#status'),tools=$('#tools'),pop=$('#tblPop'),tblBtn=$('#tblBtn'),
    delBtn=$('#delBtn'),expBtn=$('#expBtn'),expPop=$('#expPop'),expMsg=$('#expMsg'),expHint=$('#expHint');
var tblActs=[].slice.call(document.querySelectorAll('[data-act]'));

var notes=[],curId=null,filterDate='',query='',lastCell=null,savedRange=null,delArmed=0;
var col=null,synced=false,pending=new Set(),timers={},queues={};
var now=new Date(),cal={y:now.getFullYear(),m:now.getMonth()};

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function newId(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDay(s){return new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short'}).format(parseYmd(s));}
function fmtShort(s){return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}).format(parseYmd(s));}
function fmtEdited(t){return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t));}

/* ---------- sanitizer ---------- */
var ALLOW={P:1,DIV:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TD:1,TH:1,H1:1,H2:1,H3:1,BLOCKQUOTE:1};
var SKIP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,TEMPLATE:1,NOSCRIPT:1,SVG:1,IMG:1,VIDEO:1,AUDIO:1,CANVAS:1,FORM:1,INPUT:1,BUTTON:1,SELECT:1,TEXTAREA:1,HEAD:1};
function clean(html){
  var doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  var out=document.createElement('div');
  (function walk(src,dst){
    src.childNodes.forEach(function(n){
      if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue));return;}
      if(n.nodeType!==1)return;
      var t=n.tagName.toUpperCase();
      if(SKIP[t])return;
      if(ALLOW[t]){
        var e=document.createElement(t.toLowerCase());
        if(t==='TD'||t==='TH'){['colspan','rowspan'].forEach(function(a){var v=parseInt(n.getAttribute(a)||'',10);if(v>1&&v<50)e.setAttribute(a,v);});}
        walk(n,e);dst.appendChild(e);
      }else walk(n,dst);
    });
  })(doc.body,out);
  return out.innerHTML;
}
function norm(n){
  return {id:String(n.id),title:String(n.title||''),html:clean(String(n.html||'')),
    date:/^\d{4}-\d{2}-\d{2}$/.test(n.date||'')?n.date:'',updated:Number(n.updated)||Date.now()};
}
function textOf(n){
  if(n._x&&n._x.u===n.updated)return n._x.t;
  var d=document.createElement('div');
  d.innerHTML=n.html.replace(/<\/(p|div|li|tr|td|th|h[1-3])>|<br\s*\/?>/gi,' ');
  var t=(d.textContent||'').replace(/\s+/g,' ').trim();
  n._x={u:n.updated,t:t};return t;
}
function isEmptyNote(n){return !n.title.trim()&&!textOf(n)&&!/<table/i.test(n.html);}

/* ---------- local copy ---------- */
function loadLocal(){
  try{var a=JSON.parse(localStorage.getItem(LS)||'[]');return Array.isArray(a)?a.filter(function(n){return n&&n.id;}).map(norm):[];}catch(e){return [];}
}
function saveLocal(){
  try{localStorage.setItem(LS,JSON.stringify(notes.map(function(n){return {id:n.id,title:n.title,html:n.html,date:n.date,updated:n.updated};})));}catch(e){}
}

/* ---------- sync ---------- */
function updateStatus(){
  statusEl.textContent=!col?'Saved on this device':(pending.size?'Saving…':'Saved');
}
function mark(id){
  pending.add(id);updateStatus();
  clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){flush(id);},600);
}
function flush(id){
  clearTimeout(timers[id]);delete timers[id];
  if(!col){pending.delete(id);updateStatus();return;}
  queues[id]=(queues[id]||Promise.resolve()).then(function(){
    var m=notes.find(function(x){return x.id===id;});
    if(!m||!col)return;
    return col.doc(id).set({title:m.title,html:m.html,date:m.date,updated:m.updated});
  }).then(function(){
    if(!timers[id])pending.delete(id);
    updateStatus();
  }).catch(function(e){
    if(!timers[id])pending.delete(id);
    statusEl.textContent=(e&&e.code==='quota_exceeded')?'Storage full':'Saved on this device only';
  });
}
function flushAll(){Object.keys(timers).forEach(flush);}
function removeRemote(id){
  pending.delete(id);clearTimeout(timers[id]);delete timers[id];
  if(col){queues[id]=(queues[id]||Promise.resolve()).then(function(){return col.doc(id).delete();}).catch(function(){});}
}
function onRemote(snap){
  var remote=snap.docs.map(function(d){var x=d.data()||{};return norm({id:d.id,title:x.title,html:x.html,date:x.date,updated:x.updated});});
  var first=!synced;synced=true;
  var rm={};remote.forEach(function(r){rm[r.id]=r;});
  var next=[];
  remote.forEach(function(r){
    var l=notes.find(function(x){return x.id===r.id;});
    if(l&&(pending.has(r.id)||l.updated>r.updated)){next.push(l);if(first&&!pending.has(r.id))mark(r.id);}
    else next.push(r);
  });
  notes.forEach(function(l){
    if(rm[l.id])return;
    if(first||pending.has(l.id)){next.push(l);if(first)mark(l.id);}
  });
  notes=next;saveLocal();
  if(curId&&!notes.some(function(n){return n.id===curId;}))curId=null;
  ensureCur();
  renderCal();renderList();
  var ae=document.activeElement;
  if(curId&&!pending.has(curId)&&ae!==bodyEl&&ae!==titleEl)fillEditor();
  else if(!curId)fillEditor();
}
async function initStore(){
  try{
    if(window.claude&&claude.use){
      var r=await Promise.all([claude.use('db'),claude.use('user')]);
      var db=r[0],user=r[1];
      var id=user?await user.id():null;
      if(db&&id){
        var c=db.doc('data/users/'+id+'/notebook').collection('notes');
        col=c;
        await new Promise(function(res){
          var done=false;
          c.onSnapshot(function(s){onRemote(s);if(!done){done=true;res();}},
                       function(){col=null;updateStatus();if(!done){done=true;res();}});
        });
      }
    }
  }catch(e){col=null;}
  if(!notes.length)createWelcome();
  updateStatus();
}
function createWelcome(){
  var n={id:newId(),title:'Welcome',date:todayStr(),updated:Date.now(),
    html:'<p>A plain notepad. Everything saves as you type.</p>'+
    '<p>Use Table in the toolbar to add a table. Tab moves between cells and adds a row from the last one. Give a note a date and it shows up on the calendar.</p>'+
    '<table><thead><tr><th>Task</th><th>Due</th><th>Status</th></tr></thead><tbody><tr><td>Example row</td><td>Fri</td><td>Open</td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table><p><br></p>'};

  function need(h){if(y+h>H-M&&y>M){be.newPage();y=M;}}
  function drawLines(lines,x0,size,lh,muted){
    lines.forEach(function(ln){need(lh);ln.forEach(function(it){be.text(it.s,x0+it.x,y+size*1.1,it.st,size,muted);});y+=lh;});
  }
  if(model.title!==null&&model.title!==undefined){
    var ttl=model.title.trim()||'Untitled';
    drawLines(wrapRuns([{s:ttl,st:'b'}],avail,22,be,RTL.test(ttl)),M,22,27.5);
    y+=2;
    if(model.date){need(16);be.text(fmtDay(model.date)+' '+parseYmd(model.date).getFullYear(),M,y+9.9,'',9,true);y+=16;}
    y+=8;
  }
  model.blocks.forEach(function(b){
    if(b.t==='table'){
      var rows=b.rows;if(!rows.length)return;
      var nc=0,pad=5,size=10,lh=14,c,i;
      rows.forEach(function(r){nc=Math.max(nc,r.length);});
      if(!nc)return;
      var nat=[],mn=[];
      for(c=0;c<nc;c++){
        var n1=0,m1=0;
        rows.forEach(function(r){
          var cell=r[c];if(!cell)return;
          var st=cell.th?'b':'';
          cell.s.split('\n').forEach(function(part){
            n1=Math.max(n1,be.measure(part,st,size));
            part.split(' ').forEach(function(wd){m1=Math.max(m1,be.measure(wd,st,size));});
          });
        });
        nat.push(n1+2*pad+2);mn.push(Math.min(m1,80)+2*pad);
      }
      var w=nat.slice();
      for(var it=0;it<6;it++){
        var sum=w.reduce(function(a,v){return a+v;},0);
        if(Math.abs(sum-avail)<.5)break;
        if(sum>avail){
          var flex=[],fs=0;
          w.forEach(function(v,k){if(v>mn[k]+.1){flex.push(k);fs+=v-mn[k];}});
          if(!flex.length)break;
          var cut=Math.min(sum-avail,fs);
          flex.forEach(function(k){w[k]-=cut*(w[k]-mn[k])/fs;});
        }else{w=w.map(function(v){return v*avail/sum;});}
      }
      var tot=w.reduce(function(a,v){return a+v;},0);
      if(tot>avail+.5)w=w.map(function(v){return v*avail/tot;});
      rows.forEach(function(r){
        var cl=[],mx=1;
        for(c=0;c<nc;c++){
          var cell=r[c]||{s:'',th:false},runs=[];
          cell.s.split('\n').forEach(function(p,k){if(k)runs.push({nl:1});runs.push({s:p,st:cell.th?'b':''});});
          var ls=wrapRuns(runs,w[c]-2*pad,size,be,false);
          cl.push(ls);mx=Math.max(mx,ls.length);
        }
        var rh=mx*lh+8;
        need(rh);
        var x=M;
        for(c=0;c<nc;c++){
          if(r[c]&&r[c].th)be.rect(x,y,w[c],rh);
          x+=w[c];
        }
        be.line(M,y,M+avail,y);be.line(M,y+rh,M+avail,y+rh);
        x=M;
        for(c=0;c<=nc;c++){
          be.line(x,y,x,y+rh);
          if(c<nc){
            cl[c].forEach(function(ln,k){ln.forEach(function(it2){be.text(it2.s,x+pad+it2.x,y+4+k*lh+size*1.1,it2.st,size,false);});});
            x+=w[c];
          }
        }
        y+=rh;
      });
      y+=12;
      return;
    }
    var sz=b.t==='h'?15:11,ind=b.t==='li'?16:0,l2=sz*1.45;
    if(b.t==='h')y+=6;
    var lines=wrapRuns(b.runs,avail-ind,sz,be,b.rtl);
    lines.forEach(function(ln,k){
      need(l2);
      if(k===0&&b.t==='li'){
        if(b.ord)be.text(b.ord+'.',M,y+sz*1.1,'',sz,false);
        else be.dot(M+5,y+sz*0.68,1.7);
      }
      ln.forEach(function(it3){be.text(it3.s,M+ind+it3.x,y+sz*1.1,it3.st,sz,false);});
      y+=l2;
    });
    y+=b.t==='li'?2:6;
  });
  return y;
}
function dryBE(){return {begin:function(){},newPage:function(){},measure:measureC,text:function(){},line:function(){},rect:function(){},dot:function(){}};}
function canvasBE(pages){
  var cv,ctx,g;
  return {
    begin:function(gg){g=gg;this.newPage();},
    newPage:function(){
      cv=document.createElement('canvas');cv.width=Math.ceil(g.W*MS);cv.height=Math.ceil(g.H*MS);
      ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);pages.push(cv);
    },
    measure:measureC,
    text:function(s,x,y,st,size,m){ctx.font=fontStr(st,size*MS);ctx.fillStyle=m?'#6a6f76':'#16181a';ctx.textBaseline='alphabetic';ctx.fillText(s,x*MS,y*MS);},
    line:function(x1,y1,x2,y2){ctx.strokeStyle='#c9ccd1';ctx.lineWidth=MS*.6;ctx.beginPath();ctx.moveTo(x1*MS,y1*MS);ctx.lineTo(x2*MS,y2*MS);ctx.stroke();},
    rect:function(x,y,w,h){ctx.fillStyle='#f1f2f4';ctx.fillRect(x*MS,y*MS,w*MS,h*MS);},
    dot:function(x,y,r){ctx.fillStyle='#16181a';ctx.beginPath();ctx.arc(x*MS,y*MS,r*MS,0,7);ctx.fill();}
  };
}
function pdfBE(J,g){
  var doc=new J({unit:'pt',format:[Math.min(g.W,g.H),Math.max(g.W,g.H)],orientation:g.W>g.H?'landscape':'portrait',compress:true});
  function fs(st){return st==='bi'||st==='ib'?'bolditalic':st.indexOf('b')>=0?'bold':st.indexOf('i')>=0?'italic':'normal';}
  return {
    doc:doc,begin:function(){},newPage:function(){doc.addPage();},
    measure:function(s,st,size){doc.setFont('helvetica',fs(st));doc.setFontSize(size);return doc.getTextWidth(s);},
    text:function(s,x,y,st,size,m){doc.setFont('helvetica',fs(st));doc.setFontSize(size);if(m)doc.setTextColor(106,111,118);else doc.setTextColor(22,24,26);doc.text(s,x,y);},
    line:function(x1,y1,x2,y2){doc.setDrawColor(201,204,209);doc.setLineWidth(.6);doc.line(x1,y1,x2,y2);},
    rect:function(x,y,w,h){doc.setFillColor(241,242,244);doc.rect(x,y,w,h,'F');},
    dot:function(x,y,r){doc.setFillColor(22,24,26);doc.circle(x,y,r,'F');}
  };
}
async function pdfFrom(model,g){
  await lib('pdf');
  var J=window.jspdf.jsPDF;
  if(!NONLATIN.test(modelText(model))){
    var be=pdfBE(J,g);layout(model,be,g);
    return be.doc.output('arraybuffer');
  }
  /* text outside the standard PDF fonts (Arabic, etc.): draw pages as images so every script shows */
  var pages=[];layout(model,canvasBE(pages),g);
  var doc=new J({unit:'pt',format:[Math.min(g.W,g.H),Math.max(g.W,g.H)],orientation:g.W>g.H?'landscape':'portrait',compress:true});
  pages.forEach(function(cv,i){if(i)doc.addPage();doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,g.W,g.H);});
  return doc.output('arraybuffer');
}
async function pngFrom(model){
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;}catch(e){}
  var g={W:720,H:1e7,M:24},endY=layout(model,dryBE(),g);
  var g2={W:720,H:Math.ceil(endY+12),M:24},pages=[];
  layout(model,canvasBE(pages),g2);
  return await new Promise(function(res){pages[0].toBlob(res,'image/png');});
}
async function xlsxFrom(rows){
  await lib('xlsx');
  var aoa=rows.map(function(r){return r.map(function(c){return c.s;});}),nc=0;
  aoa.forEach(function(r){nc=Math.max(nc,r.length);});
  var ws=XLSX.utils.aoa_to_sheet(aoa),cols=[];
  for(var c=0;c<nc;c++){var m=8;aoa.forEach(function(r){if(r[c])m=Math.max(m,Math.min(48,r[c].split('\n').reduce(function(a,p){return Math.max(a,p.length);},0)+2));});cols.push({wch:m});}
  ws['!cols']=cols;
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Table');
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}
function csvFrom(rows){
  return '﻿'+rows.map(function(r){return r.map(function(c){var s=c.s;return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\r\n')+'\r\n';
}
function mdRuns(runs){
  return runs.map(function(r){
    if(r.nl)return '  \n';
    var m=r.s.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];
    if(!core)return r.s;
    var b=(r.st||'').indexOf('b')>=0,i=(r.st||'').indexOf('i')>=0,k=b&&i?'***':b?'**':i?'*':'';
    return m[1]+k+core+k+m[3];
  }).join('');
}
function mdTable(rows){
  var nc=0;rows.forEach(function(r){nc=Math.max(nc,r.length);});
  function line(r){var a=[];for(var c=0;c<nc;c++)a.push(((r[c]&&r[c].s)||'').replace(/\|/g,'\\|').replace(/\n/g,'<br>'));return '| '+a.join(' | ')+' |';}
  var sep=[];for(var c=0;c<nc;c++)sep.push('---');
  return [line(rows[0]),'| '+sep.join(' | ')+' |'].concat(rows.slice(1).map(line)).join('\n');
}
function toMarkdown(model){
  var out=[],prev='';
  function add(s,t){out.push((out.length&&!(t==='li'&&prev==='li')?'\n\n':(out.length?'\n':''))+s);prev=t;}
  add('# '+(model.title.trim()||'Untitled'),'h');
  if(model.date)add('_'+model.date+'_','p');
  model.blocks.forEach(function(b){
    if(b.t==='table'){if(b.rows.length)add(mdTable(b.rows),'table');}
    else if(b.t==='h')add('## '+runsText(b.runs).replace(/\n/g,' '),'h');
    else if(b.t==='li')add((b.ord?b.ord+'. ':'- ')+mdRuns(b.runs).replace(/\n/g,' '),'li');
    else add(mdRuns(b.runs),'p');
  });
  return out.join('')+'\n';
}
function toText(model){
  var out=[(model.title.trim()||'Untitled')];
  if(model.date)out.push(model.date);
  out.push('');
  model.blocks.forEach(function(b){
    if(b.t==='table'){
      var nc=0,w=[];b.rows.forEach(function(r){nc=Math.max(nc,r.length);});
      b.rows.forEach(function(r){r.forEach(function(c,i){w[i]=Math.max(w[i]||0,c.s.replace(/\n/g,' ').length);});});
      b.rows.forEach(function(r){var a=[];for(var i=0;i<nc;i++){var s=((r[i]&&r[i].s)||'').replace(/\n/g,' ');a.push(s+new Array(Math.max(0,(w[i]||0)-s.length)+1).join(' '));}out.push(a.join('  |  ').replace(/\s+$/,''));});
      out.push('');
    }else if(b.t==='li'){out.push((b.ord?b.ord+'. ':'- ')+runsText(b.runs).replace(/\n/g,' '));}
    else{out.push(runsText(b.runs));out.push('');}
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n').replace(/\s+$/,'')+'\n';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toHtml(n){
  var t=n.title.trim()||'Untitled';
  return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(t)+'</title>'+
    '<style>body{font:16px/1.65 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#16181a}h1{font-size:28px;margin:0 0 4px}.d{color:#6a6f76;font-size:13px;margin-bottom:24px}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #e2e4e7;padding:8px 10px;text-align:left;vertical-align:top}th{background:#f5f6f7}</style>'+
    '<h1>'+esc(t)+'</h1>'+(n.date?'<div class="d">'+esc(fmtDay(n.date)+' '+parseYmd(n.date).getFullYear())+'</div>':'')+n.html+'</html>';
}
function slug(s){return (s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'').slice(0,60)||'note';}
expPop.addEventListener('click',async function(e){
  var b=e.target.closest('button[data-exp]');if(!b||b.disabled)return;
  var p=b.dataset.exp.split(':'),kind=p[0],f=p[1],n=cur();if(!n)return;
  setBusy(true);say('Preparing…');
  var data=null,name='',base=slug(n.title);
  try{
    if(kind==='note'){
      var model=noteModel(n);
      if(f==='pdf'){data=await pdfFrom(model,A4);name=base+'.pdf';}
      else if(f==='md'){data=toMarkdown(model);name=base+'.md';}
      else if(f==='txt'){data=toText(model);name=base+'.txt';}
      else if(f==='html'){data=toHtml(n);name=base+'.html';}
    }else{
      var t=targetTable();
      if(!t||!t.el){say('Place the cursor in a table first.');return;}
      var rows=tableRows(t.el),tm={title:null,date:'',blocks:[{t:'table',rows:rows}]},nc=0;
      rows.forEach(function(r){nc=Math.max(nc,r.length);});
      base+='-table'+(t.count>1?'-'+t.idx:'');
      if(f==='pdf'){data=await pdfFrom(tm,nc>5?{W:842,H:595,M:40}:A4);name=base+'.pdf';}
      else if(f==='xlsx'){data=await xlsxFrom(rows);name=base+'.xlsx';}
      else if(f==='csv'){data=csvFrom(rows);name=base+'.csv';}
      else if(f==='png'){data=await pngFrom(tm);name=base+'.png';}
    }
    if(data===null||!name){say('Could not create the file.');return;}
    await doSave(name,data);
  }catch(err){
    say(err&&err.message==='load'?"Couldn't load the export tool. Check your connection.":'Could not create the file.');
  }finally{setBusy(false);}
});
if(window.claude&&claude.use){claude.use('downloads').then(function(d){dl=d;if(!d)expBtn.hidden=true;}).catch(function(){});}

notes=loadLocal();
ensureCur();
renderCal();renderList();fillEditor();updateStatus();
